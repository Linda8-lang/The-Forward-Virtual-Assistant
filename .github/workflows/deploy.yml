name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # This runs whenever you push to your main branch

permissions:
  contents: write # Allows the action to push files to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/checkout@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Changed from 'docs' to 'dist' to match vite build output
          branch: gh-pages